opencollection: 1.0.0

info:
  name: Split It!
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{oauth2_auth_url}}"
    accessTokenUrl: "{{oauth2_access_token_url}}"
    callbackUrl: "{{oauth2_callback_url}}"
    credentials:
      clientId: "{{oauth2_client_id}}"
      placement: body
    pkce: {}
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
