spring.application.name=SplitIt!

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/splitit}
spring.datasource.username=${DB_USERNAME:splitit}
spring.datasource.password=${DB_PASSWORD:splitit}

spring.threads.virtual.enabled=true

# Bearer JWTs are validated against the Keycloak realm (default: docker-compose keycloak, port 8180)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/split_it}
