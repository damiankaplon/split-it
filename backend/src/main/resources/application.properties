spring.application.name=SplitIt!
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/splitit}
spring.datasource.username=${DB_USERNAME:splitit}
spring.datasource.password=${DB_PASSWORD:splitit}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.threads.virtual.enabled=true
# Spring Data REST exports only repositories annotated with @RepositoryRestResource (opt-in)
spring.data.rest.detection-strategy=annotated
# Bearer JWTs are validated against the Keycloak realm (default: docker-compose keycloak, port 8180)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/split_it}
# Spring Modulith: cross-module events are stored in event_publication in the publisher's
# transaction. Events a listener has not completed (e.g. the app crashed) are republished on
# startup, so listeners must tolerate getting an event twice. Safe only for a single instance.
spring.modulith.events.republish-outstanding-events-on-restart=true
# A completed publication moves to event_publication_archive, so event_publication keeps only
# the ones not completed yet while the history is kept. The archive grows without limit.
spring.modulith.events.completion-mode=archive
# Expense recognition from pictures (POST /recognition) asks an OpenAI vision model. Without
# OPENAI_API_KEY the app still starts, but recognition requests fail. Locally, set it in
# backend/.env (see application-local.properties).
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.model=${OPENAI_RECOGNITION_MODEL:gpt-5-mini}
# Uploads are photos/screenshots of receipts; recognition rejects anything larger
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
