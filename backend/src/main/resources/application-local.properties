# Local development, activated by the SplititApplication IntelliJ run configuration and by
# ./gradlew bootRun; never in tests or the Docker image.
# Secrets such as OPENAI_API_KEY come from backend/.env (KEY=value lines, git-ignored), read as
# properties: no `export` and no quotes. Real environment variables take precedence over it.
spring.config.import=optional:file:.env[.properties]
