services:
  postgres:
    image: postgres:17
    container_name: splitit-postgres
    environment:
      POSTGRES_DB: splitit
      POSTGRES_USER: splitit
      POSTGRES_PASSWORD: splitit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the keycloak database next to splitit on a fresh volume
      - ./docker/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitit -d splitit"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: splitit-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      # 8080 is taken by the Spring app
      - "8180:8080"
    volumes:
      # Realm is imported only if it does not exist yet in the database (--import-realm skips existing realms)
      - ./src/test/resources/keycloak/split_it-realm.json:/opt/keycloak/data/import/split_it-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
